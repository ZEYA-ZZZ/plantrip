<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปักกิ่ง · เทียนจิน — สมุดเดินทาง</title>
<style>
  :root{
    --ink:#241f1b;
    --ink-soft:#6b6156;
    --paper:#efe9dc;
    --paper-2:#e4dcc9;
    --card:#f7f3e9;
    --line:#d3c7ac;
    --seal:#b33b30;
    --seal-dark:#8f2c23;
    --jade:#3f5b4e;
    --brass:#b9924f;
    --shadow:rgba(36,31,27,0.16);
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Sarabun",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ---------- layout shell ---------- */
  .app{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:100vh;
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
  }

  /* ---------- sidebar / day nav ---------- */
  .sidebar{
    background:var(--paper-2);
    border-right:1px solid var(--line);
    padding:28px 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  @media (max-width:820px){
    .sidebar{
      border-right:none;
      border-bottom:1px solid var(--line);
      flex-direction:row;
      overflow-x:auto;
      padding:14px 12px;
      gap:10px;
      position:sticky; top:0; z-index:20;
    }
  }

  .brand{
    padding:2px 8px 22px 8px;
  }
  .brand .cn{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .brand h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    margin:4px 0 0 0;
    line-height:1.15;
  }
  @media (max-width:820px){ .brand{display:none;} }

  .day-btn{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border:none;
    background:transparent;
    border-radius:10px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    color:var(--ink);
    transition:background .15s ease;
    flex-shrink:0;
  }
  .day-btn:hover{background:rgba(179,59,48,0.08);}
  .day-btn.active{background:var(--card); box-shadow:0 1px 0 var(--line) inset;}
  .day-btn .label{
    display:flex; flex-direction:column; line-height:1.25;
  }
  .day-btn .label .d{font-weight:600; font-size:14px;}
  .day-btn .label .t{font-size:11.5px; color:var(--ink-soft);}

  /* seal / chop badge — fills in as stops get marked visited */
  .seal-badge{
    width:34px; height:34px; border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background:
      conic-gradient(var(--seal) calc(var(--pct,0)*1%), transparent 0),
      transparent;
    border:1.5px solid var(--seal);
  }
  .seal-badge::after{
    content:'';
    position:absolute; inset:3px;
    border-radius:50%;
    background:var(--paper-2);
  }
  .day-btn.active .seal-badge::after{ background:var(--card); }
  .seal-badge span{
    position:relative; z-index:1;
    font-family:Georgia,serif;
    font-size:12px; font-weight:700;
    color:var(--seal-dark);
  }
  .day-btn.active .seal-badge{ border-color:var(--seal-dark); }

  /* ---------- main ---------- */
  .main{
    padding:30px clamp(16px,4vw,56px) 80px;
    max-width:900px;
  }

  .hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
    margin-bottom:26px;
  }
  .hero h2{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(26px,4vw,36px);
    margin:0 0 4px 0;
  }
  .hero .sub{ color:var(--ink-soft); font-size:13.5px; }
  .skyline{ opacity:.55; flex-shrink:0; }

  .day-progress{
    font-size:12px; color:var(--ink-soft); margin-bottom:22px;
    display:flex; align-items:center; gap:8px;
  }
  .day-progress .bar{
    flex:1; height:4px; background:var(--paper-2); border-radius:4px; overflow:hidden;
  }
  .day-progress .bar i{
    display:block; height:100%; background:var(--seal); border-radius:4px;
    transition:width .3s ease;
  }

  /* ---------- timeline ---------- */
  .timeline{ position:relative; }
  .timeline::before{
    content:'';
    position:absolute; left:9px; top:6px; bottom:6px;
    width:1.5px; background:var(--line);
  }

  .entry{
    position:relative;
    padding-left:34px;
    margin-bottom:16px;
    opacity:0; transform:translateY(6px);
    animation:rise .35s ease forwards;
  }
  .entry:nth-child(1){animation-delay:.02s}
  .entry:nth-child(2){animation-delay:.05s}
  .entry:nth-child(3){animation-delay:.08s}
  .entry:nth-child(4){animation-delay:.11s}
  .entry:nth-child(5){animation-delay:.14s}
  .entry:nth-child(n+6){animation-delay:.16s}
  @keyframes rise{ to{opacity:1; transform:none;} }

  .dot{
    position:absolute; left:0; top:4px;
    width:19px; height:19px; border-radius:50%;
    background:var(--paper);
    border:1.5px solid var(--line);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .entry.stop .dot{ border-color:var(--jade); }
  .entry.stop.visited .dot{ background:var(--jade); }
  .entry.stop.visited .dot::after{
    content:'✓'; color:#fff; font-size:11px; font-weight:700;
  }
  .entry.travel .dot{
    width:13px; height:13px; left:3px; top:6px;
    border-style:dashed;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 15px;
  }
  .entry.travel .card{
    background:transparent; border:none; padding:2px 0 2px 2px;
  }

  .time{
    font-family:Georgia,serif;
    font-size:12.5px;
    color:var(--seal-dark);
    font-weight:700;
    letter-spacing:.02em;
  }
  .entry.travel .time{ color:var(--ink-soft); font-weight:600; }

  .name{
    font-size:15.5px; font-weight:600; margin:2px 0 3px 0;
  }
  .entry.travel .name{ font-size:13px; font-weight:500; color:var(--ink-soft); }

  .note{ font-size:13px; color:var(--ink-soft); line-height:1.45; }

  .card-foot{
    display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap;
  }
  .photo-add{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; color:var(--jade); background:transparent;
    border:1px solid var(--jade); border-radius:20px;
    padding:5px 11px; cursor:pointer; font-family:inherit;
    transition:background .15s ease, color .15s ease;
  }
  .photo-add:hover{ background:var(--jade); color:#fff; }

  .thumbs{ display:flex; gap:7px; flex-wrap:wrap; margin-top:4px; }
  .thumb{
    width:52px; height:52px; border-radius:8px; overflow:hidden;
    border:1px solid var(--line); cursor:pointer; position:relative;
    flex-shrink:0;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; background:rgba(20,17,14,0.86);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:min(90vw,700px); max-height:80vh; border-radius:8px; display:block; }
  .lightbox-bar{
    position:absolute; top:18px; right:18px; display:flex; gap:10px;
  }
  .lightbox-bar button{
    background:rgba(255,255,255,0.12); color:#fff; border:none;
    border-radius:8px; padding:8px 14px; cursor:pointer; font-family:inherit; font-size:13px;
  }
  .lightbox-bar button:hover{ background:rgba(255,255,255,0.22); }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(8px);
    background:var(--ink); color:var(--paper); padding:9px 16px; border-radius:20px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:200;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  input[type=file]{ display:none; }

  a:focus-visible, button:focus-visible{
    outline:2px solid var(--seal); outline-offset:2px;
  }
</style>
</head>
<body>

<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="brand">

      <h1>สมุดเดินทาง<br>ปักกิ่ง–เทียนจิน</h1>

  </nav>

  <main class="main">

    </div>

    <div class="timeline" id="timeline"></div>
  </main>
</div>

<div class="lightbox" id="lightbox">

    <button id="lbClose">ปิด</button>
  </div>
  <img id="lbImg" src="" alt="">
</div>

<div class="toast" id="toast"></div>

  { day:7, date:"12 พ.ย. 2569", weekday:"พฤหัสบดี", theme:"798 Art Zone · เดินทางกลับ", stops:[

    {t:"07:00–07:40", n:"เดินทางไป 798 Art Zone", note:"~30–40 นาที", type:"travel"},
    {t:"07:40–09:10", n:"798 Art Zone", note:"เช้าสุด คนน้อย", type:"stop"},
    {t:"09:10–09:35", n:"เดินทางไป Red Brick Art Museum", note:"~20–25 นาที", type:"travel"},
    {t:"09:35–10:50", n:"Red Brick Art Museum", note:"", type:"stop"},
    {t:"10:50–11:10", n:"เดินทางไป Phoenix Media Center", note:"~20 นาที", type:"travel"},
    {t:"11:10–11:40", n:"Phoenix Media Center", note:"ถ่ายรูปด้านนอก", type:"stop"},
    {t:"11:40–12:00", n:"เดินทางไป Sanlitun", note:"~20 นาที", type:"travel"},
    {t:"12:00–13:30", n:"Sanlitun + มื้อเที่ยง", note:"จำกัดเวลา ต้องออกไม่เกิน 13:30–14:00", type:"stop"},
    {t:"14:00–15:15", n:"เดินทางไปสนามบิน", note:"เผื่อเวลารถติดช่วงเร่งด่วน", type:"travel"},
    {t:"15:15–17:00", n:"เช็คอิน + ตรวจคนเข้าเมือง", note:"", type:"stop"},
    {t:"17:30", n:"ขึ้นเครื่อง", note:"", type:"stop"},
  ]},
];

/* ---------------- state ---------------- */
let currentDay = 1;
let visited = {};           // {"1-2": true, ...}
const photoCache = {};      // {"1-2": [dataUrl, ...]}
let storageReady = false;

const el = id => document.getElementById(id);
const sidebar = el('sidebar');
const timelineEl = el('timeline');

/* ---------------- storage helpers ---------------- */
async function safeGet(key){
  try{
    const r = await window.storage.get(key, false);
    return r ? r.value : null;
  }catch(e){ return null; }
}
async function safeSet(key, value){
  try{ await window.storage.set(key, value, false); return true; }
  catch(e){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); return false; }
}
async function loadAll(){
  const v = await safeGet('visited_stops');
  if(v){ try{ visited = JSON.parse(v); }catch(e){ visited = {}; } }

  try{
    const listRes = await window.storage.list('photos_', false);
    const keys = (listRes && listRes.keys) ? listRes.keys : [];
    for(const k of keys){
      const val = await safeGet(k);
      if(val){
        const id = k.replace('photos_','');
        try{ photoCache[id] = JSON.parse(val); }catch(e){}
      }
    }
  }catch(e){ /* no photos yet */ }

  storageReady = true;
}

function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- rendering ---------------- */
function dayPct(day){
  const stops = itinerary[day-1].stops.filter(s=>s.type==='stop');
  if(stops.length===0) return 0;
  let done = 0;
  stops.forEach((s,i)=>{ if(visited[day+'-'+realIndex(day,s)]) done++; });
  return Math.round(done/stops.length*100);
}
function realIndex(day, stopObj){
  return itinerary[day-1].stops.indexOf(stopObj);
}

function renderSidebar(){
  sidebar.querySelectorAll('.day-btn').forEach(b=>b.remove());
  itinerary.forEach(d=>{
    const btn = document.createElement('button');
    btn.className = 'day-btn' + (d.day===currentDay ? ' active':'');
    btn.style.setProperty('--pct', dayPct(d.day));
    btn.innerHTML = `
      <span class="seal-badge"><span>${d.day}</span></span>
      <span class="label">
        <span class="d">Day ${d.day}</span>
        <span class="t">${d.theme}</span>
      </span>`;
    btn.addEventListener('click', ()=> selectDay(d.day));
    sidebar.appendChild(btn);
  });
}

function renderHero(){
  const d = itinerary[currentDay-1];
  el('dayTitle').textContent = `Day ${d.day}`;
  el('daySub').textContent = `${d.date} · ${d.weekday} — ${d.theme}`;
}

function renderProgress(){
  const d = itinerary[currentDay-1];
  const stops = d.stops.filter(s=>s.type==='stop');
  const done = stops.filter((s,i)=> visited[d.day+'-'+realIndex(d.day,s)]).length;
  el('progressLabel').textContent = `${done} / ${stops.length} จุดที่ไปแล้ว`;
  el('progressBar').style.width = (stops.length? done/stops.length*100:0) + '%';
}

function renderTimeline(){
  const d = itinerary[currentDay-1];
  timelineEl.innerHTML = '';
  d.stops.forEach((s, idx)=>{
    const id = d.day + '-' + idx;
    const isStop = s.type === 'stop';
    const entry = document.createElement('div');
    entry.className = 'entry ' + s.type + (isStop && visited[id] ? ' visited':'');

    const dot = document.createElement('div');
    dot.className = 'dot';
    if(isStop){
      dot.title = 'ทำเครื่องหมายว่าไปแล้ว';
      dot.addEventListener('click', ()=> toggleVisited(id, entry, dot));
    }
    entry.appendChild(dot);

    const card = document.createElement('div');
    card.className = 'card';

    const time = document.createElement('div');
    time.className = 'time'; time.textContent = s.t;
    card.appendChild(time);

    const name = document.createElement('div');
    name.className = 'name'; name.textContent = s.n;
    card.appendChild(name);

    if(s.note){
      const note = document.createElement('div');
      note.className = 'note'; note.textContent = s.note;
      card.appendChild(note);
    }

    if(isStop){
      const foot = document.createElement('div');
      foot.className = 'card-foot';

      const addBtn = document.createElement('button');
      addBtn.className = 'photo-add';
      addBtn.innerHTML = '📷 เพิ่มรูป';
      const fileInput = document.createElement('input');
      fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.multiple = true;
      fileInput.addEventListener('change', e=> handleFiles(e.target.files, id, thumbsWrap));
      addBtn.addEventListener('click', ()=> fileInput.click());
      foot.appendChild(addBtn);
      foot.appendChild(fileInput);

      card.appendChild(foot);

      const thumbsWrap = document.createElement('div');
      thumbsWrap.className = 'thumbs';
      renderThumbs(id, thumbsWrap);
      card.appendChild(thumbsWrap);
    }

    entry.appendChild(card);
    timelineEl.appendChild(entry);
  });
}

function renderThumbs(id, wrap){
  wrap.innerHTML = '';
  const photos = photoCache[id] || [];
  photos.forEach((src, i)=>{
    const th = document.createElement('div');
    th.className = 'thumb';
    const img = document.createElement('img');
    img.src = src; img.alt = '';
    th.appendChild(img);
    th.addEventListener('click', ()=> openLightbox(id, i, wrap));
    wrap.appendChild(th);
  });
}

async function toggleVisited(id, entry, dot){
  visited[id] = !visited[id];
  entry.classList.toggle('visited', !!visited[id]);
  renderProgress();
  renderSidebar();
  // re-highlight active after re-render
  document.querySelectorAll('.day-btn').forEach((b,i)=>{
    if(itinerary[i].day===currentDay) b.classList.add('active');
  });
  await safeSet('visited_stops', JSON.stringify(visited));
}

function selectDay(day){
  currentDay = day;
  renderSidebar();
  renderHero();
  renderProgress();
  renderTimeline();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- photo handling ---------------- */
function resizeImage(file, maxW=900, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFiles(fileList, id, thumbsWrap){
  if(!fileList.length) return;
  showToast('กำลังบันทึกรูป…');
  const existing = photoCache[id] || [];
  for(const file of fileList){
    try{
      const dataUrl = await resizeImage(file);
      existing.push(dataUrl);
    }catch(e){ /* skip bad file */ }
  }
  photoCache[id] = existing;
  renderThumbs(id, thumbsWrap);
  const ok = await safeSet('photos_' + id, JSON.stringify(existing));
  showToast(ok ? 'บันทึกรูปแล้ว' : 'บันทึกไม่สำเร็จ (ไฟล์อาจใหญ่ไป)');
}

/* ---------------- lightbox ---------------- */
let lbState = { id:null, index:null, wrap:null };
function openLightbox(id, index, wrap){
  lbState = { id, index, wrap };
  el('lbImg').src = (photoCache[id]||[])[index] || '';
  el('lightbox').classList.add('open');
}
function closeLightbox(){
  el('lightbox').classList.remove('open');
  lbState = { id:null, index:null, wrap:null };
}
el('lbClose').addEventListener('click', closeLightbox);
el('lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closeLightbox(); });
el('lbDelete').addEventListener('click', async ()=>{
  const { id, index, wrap } = lbState;
  if(id==null) return;
  const arr = photoCache[id] || [];
  arr.splice(index, 1);
  photoCache[id] = arr;
  if(wrap) renderThumbs(id, wrap);
  await safeSet('photos_' + id, JSON.stringify(arr));
  closeLightbox();
  showToast('ลบรูปแล้ว');
});

/* ---------------- init ---------------- */
(async function init(){
  renderSidebar();
  renderHero();
  renderProgress();
  renderTimeline();
  await loadAll();
  renderSidebar();
  renderTimeline();
})();
</script>
</body>
